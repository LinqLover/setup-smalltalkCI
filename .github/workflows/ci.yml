name: 'CI'
on: [push, pull_request]

jobs:
  self-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        smalltalk: [Squeak64-trunk, Squeak32-4.5]
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - if: runner.os != 'Windows'
        run: |
          smalltalkci --help
          [[ ! -z "${SMALLTALK_CI_HOME}" ]] || ( echo "SMALLTALK_CI_HOME not set" && false )
      - shell: bash
        if: runner.os == 'Windows'
        run: smalltalkci --help

  test-vm-installation:
    strategy:
      matrix:
        smalltalk: [Squeak64-6.0, Squeak32-6.0]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Install VM
        run: smalltalkci -s ${{ matrix.smalltalk }} tests/empty.smalltalk.ston
      - name: Search ELF dependencies
        shell: bash
        run: |
          set -o pipefail
          ./tests/check_elf_deps.js $SMALLTALK_CI_VMS/${{ matrix.smalltalk }} \
            | tee "${{ runner.temp }}/elf-deps.log" \
            || true
      - name: Check for missing dependencies
        shell: bash
        run: |
          set -euo pipefail

          filtered="$(
            jq '
              def ignored:
                [
                  "vm-sound-NAS.so"
                ];

              with_entries(
                select(
                  (.key | split("/")[-1]) as $basename
                  | ignored | index($basename) | not
                )
              )
            ' "${{ runner.temp }}/elf-deps.json"
          )"

          echo "$filtered"

          if [ "$(jq 'length' <<< "$filtered")" -ne 0 ]; then
            echo "Unexpected missing shared libraries remain after allowlist filtering" >&2
            exit 1
          fi
